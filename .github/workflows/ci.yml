name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Verify no credentials in build output
        run: |
          # Service account JSON keys contain a literal `"private_key"` field
          # with a PEM block. Catch both shapes — bare PEM and the JSON field —
          # in case anyone embeds a key for "convenience" during dev.
          if grep -rE 'BEGIN (EC |RSA )?PRIVATE KEY|"private_key"\s*:\s*"-----BEGIN' dist/ 2>/dev/null; then
            echo "::error::Private key material found in dist/"
            exit 1
          fi
